<div id="zimba-intro" class="zimba-intro" role="status" aria-live="polite" aria-label="Opening Zimba Rent">
  <div class="intro-scene" aria-hidden="true">
    <div class="intro-ground"></div>
    <svg class="intro-house" viewBox="0 0 220 192" xmlns="http://www.w3.org/2000/svg">
      <path d="M23 88 110 16 197 88" stroke="#D9E7B5" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 87V165H180V87" stroke="#D9E7B5" stroke-width="8" fill="none" stroke-linejoin="round"/>
      <path d="M84 165V106H136V165" fill="#103528" stroke="#D9E7B5" stroke-width="5"/>
      <g class="intro-door"><rect x="87" y="109" width="46" height="54" rx="2" fill="#A2BC8F"/><circle cx="126" cy="138" r="2.4" fill="#244938"/></g>
      <rect x="56" y="101" width="22" height="23" rx="2" fill="#B6D1A1"/>
      <rect x="144" y="101" width="21" height="23" rx="2" fill="#B6D1A1"/>
    </svg>
    <div class="walker-wrap">
      <svg class="intro-man" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="72" cy="165" rx="29" ry="3" fill="#B3CEAA" opacity=".21"/>
        <g class="walker-bob" fill="none" stroke="#F6FAF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <g class="walker-leg back-leg"><path d="M72 91L62 125L56 158"/><path d="M56 158L69 158"/></g>
          <g class="walker-arm back-arm"><path d="M72 56L94 78L102 90"/></g>
          <path d="M72 44L72 91"/>
          <circle cx="72" cy="29" r="13" fill="#EAF2DE" stroke="none"/>
          <g class="walker-leg front-leg"><path d="M72 91L87 122L93 158"/><path d="M93 158L105 158"/></g>
          <g class="walker-arm front-arm">
            <path d="M72 56L53 75L39 90"/>
            <g class="suitcase-swing">
              <path d="M39 90L39 97" stroke-width="4"/>
              <rect x="20" y="97" width="38" height="30" rx="5" fill="#CFE4A8" stroke="#BFD69A" stroke-width="2"/>
              <path d="M30 97V92Q30 88 34 88H44Q48 88 48 92V97" stroke="#CFE4A8" stroke-width="3.5"/>

          </g>

      </svg>
    </div>
  </div>
  <div class="intro-brand"><strong>ZIMBA RENT</strong><span>SPACES FOR WHAT’S NEXT</span></div>
  <div class="intro-progress" aria-hidden="true"><span></span></div>
</div>
<script>
(function() {
  const loader = document.getElementById('zimba-intro');
  if (!loader) return;
  let closed = false;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const started = performance.now();
  function closeLoader() {
    if (closed) return;
    closed = true;
    loader.classList.add('intro-done');
    loader.setAttribute('aria-hidden', 'true');
    window.setTimeout(() => loader.remove(), 700);
  }
  // The intro is intentionally short and never blocks interaction indefinitely.
  const target = reduced ? 350 : 4700;
  function scheduleExit() {
    const left = Math.max(0, target - (performance.now() - started));
    window.setTimeout(closeLoader, left);
  }
  if (document.readyState === 'complete') scheduleExit();
  else window.addEventListener('load', scheduleExit, {once:true});
  window.setTimeout(closeLoader, reduced ? 900 : 5800);
})();
</script>
<div id="app"><div class="preload"><span class="wordmark">zimba<span>.</span></span><p>Finding your next chapter.</p></div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
