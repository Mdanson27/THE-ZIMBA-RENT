<script>
(function() {
  const loader = document.getElementById('zimba-intro');
  if (!loader) return;
  let closed = false;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const started = performance.now();
  function closeLoader() {
    if (closed) return;
    closed = true;
    loader.classList.add('intro-done');
    loader.setAttribute('aria-hidden', 'true');
    window.setTimeout(() => loader.remove(), 700);
  }
  // The intro is intentionally short and never blocks interaction indefinitely.
  const target = reduced ? 350 : 5100;
  function scheduleExit() {
    const left = Math.max(0, target - (performance.now() - started));
    window.setTimeout(closeLoader, left);
  }
  if (document.readyState === 'complete') scheduleExit();
  else window.addEventListener('load', scheduleExit, {once:true});
  window.setTimeout(closeLoader, reduced ? 900 : 6300);
})();
</script>
<div id="app"><div class="preload"><span class="wordmark">zimba<span>.</span></span><p>Finding your next chapter.</p></div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
