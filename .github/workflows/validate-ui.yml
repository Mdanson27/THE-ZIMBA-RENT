name: Validate Zimba UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/workspace-v3.js
          node --check assets/super-admin.js
          node --check assets/legal.js
          node --check assets/operations.js
          node --check assets/building.js
          node --check assets/tenant-portal.js
          node --check assets/notifications.js
          node --check assets/live-refresh.js
          node --check assets/lease-finance.js
          node --check assets/land-leases.js
          node --check assets/accessibility-theme.js
          node --check assets/auth.js
          node --check api/server.mjs
          node --check api/admin.mjs
      - name: Assert protected routes and required assets
        run: |
          node -e "const fs=require('fs'),assert=require('assert');const html=fs.readFileSync('index.html','utf8');for(const f of ['assets/styles.css','assets/workspace-v3.css','assets/arrival-v4.css','assets/workspace-v3.js','assets/super-admin.js','assets/super-admin.css','assets/legal.js','assets/legal.css','assets/operations.js','assets/operations.css','assets/building.js','assets/building.css','assets/tenant-portal.js','assets/tenant-portal.css','assets/notifications.js','assets/notifications.css','assets/live-refresh.js','assets/lease-finance.js','assets/lease-finance.css','assets/land-leases.js','assets/accessibility-theme.js','assets/accessibility-theme.css','assets/app.js','assets/auth.js']){assert(fs.existsSync(f),f+' missing');assert(html.includes(f),f+' not referenced')}const app=fs.readFileSync('assets/app.js','utf8'),workspace=fs.readFileSync('assets/workspace-v3.js','utf8');assert(app.includes('window.ZimbaWorkspace.render(p)'));assert(app.includes('window.ZimbaConsole.render(p)'));assert(workspace.includes('if(!a.state.user||!a.state.user.emailVerified)'));assert(workspace.includes('const caps={free:1'));assert(workspace.includes('window.ZimbaAuth.myPlan()'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('isSuperAdmin()'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('Confirm tier'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ops.activate(section,record)'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ZimbaLegal.ensureAccepted'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('loadTenantInvitations'));assert(fs.readFileSync('assets/building.js','utf8').includes('generateUnits('));assert(workspace.includes('inviteWithRentStart'));assert(workspace.includes('ZimbaTenantPortal.load(section)'));assert(fs.readFileSync('assets/tenant-portal.js','utf8').includes('verifiedBalance'));assert(fs.readFileSync('assets/tenant-portal.js','utf8').includes('SAMPLE · NOT DEPOSITED'));assert(fs.readFileSync('assets/tenant-portal.js','utf8').includes('tenantMaintenanceProgress'));assert(fs.readFileSync('assets/operations.js','utf8').includes('managerMaintenanceProgress'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ZimbaNotify?.mount()'));const auth=fs.readFileSync('assets/auth.js','utf8');assert(auth.includes('NEON_JWT_ROLE_MISMATCH'));assert(auth.includes('PGRST202'));assert(!auth.includes('if(isJwt(sessionJwt))return sessionJwt'));assert(workspace.includes('changeRentStart'));assert(workspace.includes('managerSecurityAudit'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('adminSecurityAudit(150)'));assert(fs.readFileSync('assets/live-refresh.js','utf8').includes('editableActive()'));assert(workspace.includes('ZimbaLeaseFinance.load(section)'));assert(fs.readFileSync('assets/auth.js','utf8').includes('zimba_tenant_deposit_summary'));assert(fs.readFileSync('assets/lease-finance.js','utf8').includes('reviewDepositRefund'));assert(workspace.includes('ZimbaLandLeases.page()'));assert(workspace.includes('Rental agreements'));assert(fs.readFileSync('assets/lease-finance.js','utf8').includes('Monthly rent and refundable deposit'));assert(fs.readFileSync('assets/accessibility-theme.js','utf8').includes('prefers-color-scheme: dark'));console.log('Static contract checks passed')"
