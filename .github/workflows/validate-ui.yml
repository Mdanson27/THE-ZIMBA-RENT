name: Validate Zimba UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/workspace-v3.js
          node --check assets/super-admin.js
          node --check assets/legal.js
          node --check assets/operations.js
          node --check assets/building.js
          node --check assets/tenant-portal.js
          node --check assets/notifications.js
          node --check assets/live-refresh.js
          node --check assets/lease-finance.js
          node --check assets/land-leases.js
          node --check assets/accessibility-theme.js
          node --check assets/dashboard-personalization.js
          node --check assets/privacy-mode.js
          node --check assets/property-hub.js
          node --check assets/financial-intelligence.js
          node --check assets/enterprise-operations.js
          node --check assets/zimba-intelligence.js
          node --check assets/auth.js
          node --check api/server.mjs
          node --check api/admin.mjs
      - name: Test Intelligence rules and privacy boundaries
        run: node tests/intelligence.test.cjs
      - name: Assert protected routes and required assets
        run: |
          node <<'ZIMBA_ASSERTIONS'
          const fs=require('fs'),assert=require('assert');const html=fs.readFileSync('index.html','utf8');for(const f of ['assets/styles.css','assets/workspace-v3.css','assets/arrival-v4.css','assets/workspace-v3.js','assets/super-admin.js','assets/super-admin.css','assets/legal.js','assets/legal.css','assets/operations.js','assets/operations.css','assets/building.js','assets/building.css','assets/tenant-portal.js','assets/tenant-portal.css','assets/notifications.js','assets/notifications.css','assets/live-refresh.js','assets/lease-finance.js','assets/lease-finance.css','assets/land-leases.js','assets/accessibility-theme.js','assets/accessibility-theme.css','assets/dashboard-personalization.js','assets/dashboard-personalization.css','assets/privacy-mode.js','assets/property-hub.js','assets/property-hub.css','assets/financial-intelligence.js','assets/financial-intelligence.css','assets/enterprise-operations.js','assets/enterprise-operations.css','assets/zimba-intelligence.js','assets/zimba-intelligence.css','assets/app.js','assets/auth.js']){assert(fs.existsSync(f),f+' missing');assert(html.includes(f),f+' not referenced')}const app=fs.readFileSync('assets/app.js','utf8'),workspace=fs.readFileSync('assets/workspace-v3.js','utf8');assert(app.includes('window.ZimbaWorkspace.render(p)'));assert(app.includes('window.ZimbaConsole.render(p)'));assert(workspace.includes('if(!a.state.user||!a.state.user.emailVerified)'));assert(workspace.includes('const caps={free:1'));assert(workspace.includes('window.ZimbaAuth.myPlan()'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('isSuperAdmin()'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('Confirm tier'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ops.activate(section,record)'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ZimbaLegal.ensureAccepted'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('loadTenantInvitations'));assert(fs.readFileSync('assets/building.js','utf8').includes('generateUnits('));assert(workspace.includes('inviteWithRentStart'));assert(workspace.includes('ZimbaTenantPortal.load(section)'));assert(fs.readFileSync('assets/tenant-portal.js','utf8').includes('verifiedBalance'));assert(fs.readFileSync('assets/tenant-portal.js','utf8').includes('SAMPLE · NOT DEPOSITED'));assert(fs.readFileSync('assets/tenant-portal.js','utf8').includes('tenantMaintenanceProgress'));assert(fs.readFileSync('assets/operations.js','utf8').includes('managerMaintenanceProgress'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ZimbaNotify?.mount()'));const auth=fs.readFileSync('assets/auth.js','utf8');assert(auth.includes('NEON_JWT_ROLE_MISMATCH'));assert(auth.includes('PGRST202'));assert(!auth.includes('if(isJwt(sessionJwt))return sessionJwt'));assert(workspace.includes('changeRentStart'));assert(workspace.includes('managerSecurityAudit'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('adminSecurityAudit(150)'));assert(fs.readFileSync('assets/live-refresh.js','utf8').includes('editableActive()'));assert(workspace.includes('ZimbaLeaseFinance.load(section,managed())'),'Lease finance load must pass manager context');assert(fs.readFileSync('assets/auth.js','utf8').includes('zimba_tenant_deposit_summary'));assert(fs.readFileSync('assets/lease-finance.js','utf8').includes('reviewDepositRefund'));assert(workspace.includes('ZimbaLandLeases.page()'));assert(workspace.includes('Rental agreements'));assert(fs.readFileSync('assets/lease-finance.js','utf8').includes('Monthly rent and refundable deposit'));assert(fs.readFileSync('assets/accessibility-theme.js','utf8').includes('prefers-color-scheme: dark'));const theme=fs.readFileSync('assets/accessibility-theme.css','utf8');for(const selector of ['.zv-property-list article','.zv-modal','.zv-sidebar nav a.selected','.zv-modal-bg','.zv-user'])assert(theme.includes(selector),'Missing dark theme surface: '+selector);assert(theme.includes('body.zv-workspace-on'),'Dark style must be scoped');assert(theme.includes('background-color:var(--z-ui-card)!important'),'Dark surfaces must have matching background');assert(theme.split('{').length===theme.split('}').length,'CSS rule braces mismatch');for(const selector of ['.zb-toolbar','.zb-metrics article','.zb-floor','.zb-unit.zb-occupied','.zt-thread','.zt-bubble.mine','.zn-item.unread','.zc-panel'])assert(theme.includes(selector),'Missing component dark theme: '+selector);assert(!theme.includes(' :is(h1,h2,h3,h4,p,strong,b,small,label,td,th,summary'),'Global dark text override was reintroduced');assert(auth.includes('signedJwtCache'),'Database tokens must be cached briefly');assert(auth.includes('tokenInFlight'),'Parallel startup calls must share a token request');assert(auth.includes('readOnly&&attempt<2'),'Write operations must not be retried on network ambiguity');assert(workspace.includes('loadWithRecovery(()=>window.ZimbaAuth.myOnboarding())'),'Onboarding must be transient-error tolerant');assert(workspace.includes('loadWithRecovery(()=>window.ZimbaAuth.myProperties())'),'Property startup must be transient-error tolerant');assert(workspace.includes('bootstrapGeneration++'),'Stale startup result guard missing');assert(workspace.includes('reconnectTimer=setTimeout'),'Account recovery must resume automatically after prolonged outage');const ops=fs.readFileSync('assets/operations.js','utf8'),widgets=fs.readFileSync('assets/dashboard-personalization.js','utf8'),privacy=fs.readFileSync('assets/privacy-mode.js','utf8');assert(ops.includes('data-z-widget'),'Widget IDs missing');assert(ops.includes('ZimbaDashboard?.activate()'),'Widget activation missing');assert(widgets.includes('zimba:dashboard:'),'Per-user dashboard layout persistence missing');assert(widgets.includes('Keep at least one widget visible'),'Visibility safeguard missing');assert(privacy.includes('zimba:privacy:'),'Privacy must be user-scoped');assert(privacy.includes('sessionStorage'),'Privacy must be limited to the browser session');assert(privacy.includes('UGX •••••'),'Money masking missing');assert(!privacy.includes('innerHTML=masked'),'Privacy must not replace interactive form HTML');assert(privacy.includes('characterData:true'),'Privacy must handle updated text during refresh');for(const id of ['properties','maintenance','residents','receivables','priorities','recent'])assert(ops.includes(',"'+id+'")')||ops.includes(",'"+id+"')"),'Overview widget disconnected: '+id);const hub=fs.readFileSync('assets/property-hub.js','utf8');const hubCss=fs.readFileSync('assets/property-hub.css','utf8');assert(auth.includes('"zimba_property_hub"'),'Property hub RPC missing from allowlist');assert(auth.includes('async propertyHub(property)'),'Property hub auth method missing');assert(workspace.includes('ZimbaPropertyHub.page(record)'),'Hub route missing');assert(workspace.includes('ZimbaPropertyHub.bind(record)'),'Hub activation missing');assert(workspace.includes('Manage property ↗'),'Portfolio entry to property hub missing');for(const tab of ['overview','units','residents','maintenance','agreements','billing'])assert(hub.includes('["'+tab+'"'),'Hub tab missing: '+tab);assert(hub.includes('propertyHub(property.id)'),'Hub must fetch authorised property data');assert(hub.includes('Property response identity mismatch'),'Hub must validate property identity');assert(hub.includes('encodeURIComponent(id)'),'Hub links must safely encode IDs');assert(hubCss.split('{').length===hubCss.split('}').length,'Property hub CSS braces mismatch');assert(auth.includes('!["zimba_property_hub","zimba_property_financial_report","zimba_enterprise_overview","zimba_enterprise_documents_list","zimba_intelligence_snapshot"].includes(name)'),'New property, finance and enterprise read RPCs must not be negatively cached');assert(hub.includes('err?.code!=="PGRST202"'),'Property hub must retry schema propagation');assert(hub.includes('Finishing the secure property connection'),'Schema propagation must preserve a nonfatal loading state');assert(auth.includes('async propertyFinancialReport(property)'),'Secure finance RPC method missing');assert(auth.includes('"zimba_property_financial_report"'),'Finance allowlist missing');assert(hub.includes('["financials","Financial intelligence"]'),'Financial tab missing');assert(hub.includes('ZimbaFinancialIntelligence?.mount(id)'),'Financial tab mount missing');const finance=fs.readFileSync('assets/financial-intelligence.js','utf8');assert(finance.includes('propertyFinancialReport(propertyId)'),'Financial report RPC call missing');assert(finance.includes('verifiedPaymentsOnly'),'Verified evidence flag missing');assert(finance.includes('Security deposit obligations'),'Deposit isolation missing');assert(finance.includes('csvValue'),'CSV sanitization missing');const enterprise=fs.readFileSync('assets/enterprise-operations.js','utf8');assert(auth.includes('"zimba_enterprise_overview"'));assert(auth.includes('async enterpriseOverview()'));assert(auth.includes('async enterpriseDocumentRegister(v)'));assert(auth.includes('async enterpriseDocumentArchive(id,reason)'));assert(workspace.includes('window.ZimbaEnterprise.page()'));assert(workspace.includes('window.ZimbaEnterprise.bind(record)'));assert(workspace.includes('["enterprise","Enterprise Centre"'));assert(enterprise.includes('enterpriseDocuments()'));assert(enterprise.includes('managerSecurityAudit(60)'));assert(enterprise.includes('propertyFinancialReport(id)'));assert(enterprise.includes('Register reference'));const enterpriseCSS=fs.readFileSync('assets/enterprise-operations.css','utf8');assert(enterpriseCSS.split('{').length===enterpriseCSS.split('}').length,'Enterprise CSS brace mismatch');const intelligence=fs.readFileSync('assets/zimba-intelligence.js','utf8');assert(auth.includes('"zimba_intelligence_snapshot"'));assert(auth.includes('async intelligenceSnapshot(property=null)'));assert(workspace.includes('window.ZimbaIntelligence.page(record)'));assert(workspace.includes('window.ZimbaIntelligence.bind(record)'));assert(workspace.includes('["intelligence","ZIMBA Intelligence"'));assert(intelligence.includes('verifiedPaymentsOnly'));assert(intelligence.includes('transparent_rules_v1'));const intelligenceCSS=fs.readFileSync('assets/zimba-intelligence.css','utf8');assert(intelligenceCSS.split('{').length===intelligenceCSS.split('}').length,'Intelligence stylesheet brace mismatch');console.log('Static contract checks passed')
          ZIMBA_ASSERTIONS