name: Validate Zimba UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/workspace-v3.js
          node --check assets/super-admin.js
          node --check assets/legal.js
          node --check assets/operations.js
          node --check assets/auth.js
          node --check api/server.mjs
          node --check api/admin.mjs
      - name: Assert protected routes and required assets
        run: |
          node -e "const fs=require('fs'),assert=require('assert');const html=fs.readFileSync('index.html','utf8');for(const f of ['assets/styles.css','assets/workspace-v3.css','assets/arrival-v4.css','assets/workspace-v3.js','assets/super-admin.js','assets/super-admin.css','assets/legal.js','assets/legal.css','assets/operations.js','assets/operations.css','assets/app.js','assets/auth.js']){assert(fs.existsSync(f),f+' missing');assert(html.includes(f),f+' not referenced')}const app=fs.readFileSync('assets/app.js','utf8'),workspace=fs.readFileSync('assets/workspace-v3.js','utf8');assert(app.includes('window.ZimbaWorkspace.render(p)'));assert(app.includes('window.ZimbaConsole.render(p)'));assert(workspace.includes('if(!a.state.user||!a.state.user.emailVerified)'));assert(workspace.includes('const caps={free:1'));assert(workspace.includes('window.ZimbaAuth.myPlan()'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('isSuperAdmin()'));assert(fs.readFileSync('assets/super-admin.js','utf8').includes('Confirm tier'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ops.activate(section,record)'));assert(fs.readFileSync('assets/workspace-v3.js','utf8').includes('ZimbaLegal.ensureAccepted'));console.log('Static contract checks passed')"
